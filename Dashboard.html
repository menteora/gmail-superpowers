<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gmail Superpowers</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172438;background:#f5f7fb;font-size:14px}
*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:#101e35;color:#e4eaf5;padding:25px 16px}aside h2{font-size:19px;margin:0 0 34px;padding:0 12px}
nav button{display:block;width:100%;border:0;background:none;color:#bac8da;text-align:left;padding:13px 14px;border-radius:10px;cursor:pointer;margin-bottom:5px}
nav button.active,nav button:hover{background:#263a56;color:#fff}
main{padding:32px 38px;max-width:1500px;width:100%;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px}
h1{font-size:29px;letter-spacing:-.7px;margin:0}.subtitle{color:#728195;margin:7px 0 24px}
button,input,select{font:inherit}button{cursor:pointer}
.primary{background:#3463e7;color:white;border:0;border-radius:9px;padding:11px 17px}
.secondary{background:white;border:1px solid #dce3ee;color:#34445a;border-radius:8px;padding:9px 13px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:24px 0}
.metric,.panel{background:white;border:1px solid #e4e9f1;border-radius:14px;box-shadow:0 2px 10px #0a193108}
.metric{padding:21px}.metric span{color:#7b899c}.metric strong{font-size:32px;display:block;margin-top:9px;font-weight:680}
.panel{overflow:hidden}.toolbar{padding:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input.search{min-width:260px;flex:1;border:1px solid #dce3ee;padding:12px 14px;border-radius:9px}
select{padding:11px;border:1px solid #dce3ee;border-radius:9px;background:white;color:#34445a}
table{border-collapse:collapse;width:100%;text-align:left}th{background:#f9fafc;color:#8090a3;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
th,td{padding:16px;border-bottom:1px solid #edf0f5}tr:last-child td{border:0}
.item{font-weight:650;color:#172438}.muted{color:#8290a3;font-size:12px}.chip{border-radius:30px;background:#edf1fa;color:#55677f;padding:5px 10px;font-size:12px;display:inline-block}
.chip.red{background:#fff0ef;color:#c04440}.chip.gold{background:#fff4db;color:#886526}.chip.green{background:#e9f7ef;color:#21804d}
.link{color:#3463e7;text-decoration:none}.action{border:0;background:none;color:#3463e7;padding:5px}
.details{padding:12px 20px 20px 54px;background:#fbfcff}.mail{padding:13px;border-bottom:1px solid #edf0f5;display:flex;gap:10px;align-items:center;justify-content:space-between}
.mail:last-child{border:0}.hidden{display:none!important}.empty{padding:50px;text-align:center;color:#8b98a8}
#toast{position:fixed;right:22px;bottom:20px;background:#152b49;color:white;padding:13px 18px;border-radius:10px;display:none;box-shadow:0 8px 25px #10213e40}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{padding:15px}aside h2{margin-bottom:12px}nav{display:flex;gap:6px;overflow:auto}nav button{white-space:nowrap}main{padding:20px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}table{font-size:12px}th,td{padding:11px 7px}.wide{display:none}}
</style></head>
<body><div class="layout">
<aside><h2>✉ Gmail Superpowers</h2><nav id="nav">
<button class="active" data-view="cases">◫ &nbsp;Panoramica</button>
<button data-view="unassigned">▤ &nbsp;Email senza caso</button>
<button data-view="archive">▣ &nbsp;Archivio</button>
</nav></aside>
<main>
<header><div><h1 id="heading">Panoramica</h1><p class="subtitle" id="subtitle">Gestisci casi, conversazioni e scadenze in un unico posto</p></div>
<button class="secondary" id="refresh">↻ Aggiorna</button></header>
<div class="metrics" id="metrics"><div class="metric"><span>Casi aperti</span><strong>—</strong></div><div class="metric"><span>Email gestite</span><strong>—</strong></div><div class="metric"><span>Scadenze superate</span><strong>—</strong></div><div class="metric"><span>Da gestire oggi</span><strong>—</strong></div></div>
<div class="panel"><div class="toolbar">
<input class="search" type="search" id="search" placeholder="Cerca per caso, oggetto email o stato…">
<select id="filter"><option value="all">Tutte le scadenze</option><option value="overdue">Scadute</option><option value="today">Oggi</option><option value="week">Prossimi 7 giorni</option><option value="none">Senza scadenza</option></select>
</div><div id="content"><div class="empty">Caricamento dati…</div></div></div>
</main></div><div id="toast" role="status"></div>
<script>
const state={data:null,view:'cases',query:'',filter:'all',expanded:new Set(),busy:false};
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s.length===10?s+'T12:00:00':s).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'}):'—';
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function rpc(name,arg){return new Promise((resolve,reject)=>{if(!window.google?.script?.run){reject(new Error('Apri tramite il deployment Apps Script'));return}
google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e))))[name](...(arg===undefined?[]:[arg]));});}
function due(items){return items.map(e=>e.dueDate).filter(Boolean).sort()[0]||''}
function qualifies(items){if(state.filter==='all')return true;const today=state.data.today,end=state.data.weekEnd;return items.some(e=>{const d=e.dueDate||'';return state.filter==='none'?!d:state.filter==='overdue'?(d&&d<today):state.filter==='today'?d===today:(d>today&&d<=end)})}
function pill(d){return !d?'<span class="muted">Nessuna</span>':'<span class="chip '+(d<state.data.today?'red':d===state.data.today?'gold':'green')+'">'+date(d)+'</span>'}
function mailHtml(e){return '<div class="mail"><div><a target="_blank" rel="noopener" class="link" href="'+esc(e.url)+'">'+esc(e.subject||'Senza oggetto')+'</a><div class="muted">'+esc(e.status||'Nessuno stato')+' · Scadenza '+date(e.dueDate)+'</div></div><div><button class="action" data-action="edit" data-id="'+esc(e.key)+'">Modifica</button> '+(e.caseId?'<button class="action" data-action="detach" data-id="'+esc(e.key)+'">Scollega</button>':'') <button class="action" data-action="archive-email" data-id="'+esc(e.key)+'">Archivia</button></div></div>'}
function render(){
const d=state.data;if(!d)return;
$('metrics').innerHTML=[['Casi aperti',d.metrics.cases],['Email gestite',d.metrics.emails],['Scadute',d.metrics.overdue],['Da gestire oggi',d.metrics.today]].map(([name,value])=>'<div class="metric"><span>'+esc(name)+'</span><strong>'+value+'</strong></div>').join('');
const titles={cases:'Panoramica',unassigned:'Email senza caso',archive:'Archivio'};
$('heading').textContent=titles[state.view];
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
const q=state.query.toLocaleLowerCase('it');
if(state.view==='archive'){
const items=d.archive.filter(v=>(v.name+' '+v.type).toLocaleLowerCase('it').includes(q));
$('content').innerHTML=items.length?'<table><thead><tr><th>Elemento</th><th>Chiuso il</th><th>N. email</th><th>Azione</th></tr></thead><tbody>'+items.map(a=>'<tr><td><div class="item">'+esc(a.name)+'</div><small class="muted">'+esc(a.type)+'</small></td><td>'+date(a.at)+'</td><td>'+a.count+'</td><td><button class="action" data-action="restore" data-id="'+esc(a.id)+'">Ripristina</button></td></tr>').join('')+'</tbody></table>':'<div class="empty">Nessun elemento in archivio.</div>';return;}
if(state.view==='unassigned'){
const items=d.ungrouped.filter(e=>(e.subject+' '+e.status+' '+e.notes).toLocaleLowerCase('it').includes(q)&&qualifies([e]));
$('content').innerHTML=items.length?items.map(e=>mailHtml(e).replace('Scollega</button>','Scollega</button>')).join(''):'<div class="empty">Nessuna conversazione corrispondente.</div>';return;}
const cases=d.cases.filter(c=>(c.name+' '+c.emails.map(e=>e.subject+' '+e.status).join(' ')).toLocaleLowerCase('it').includes(q)&&qualifies(c.emails));
cases.sort((a,b)=>(due(a.emails)||'9999').localeCompare(due(b.emails)||'9999')||a.name.localeCompare(b.name,'it'));
$('content').innerHTML=cases.length?'<table><thead><tr><th>Caso</th><th>Conversazioni</th><th>Prima scadenza</th><th class="wide">Ultima attività nota</th><th>Azioni</th></tr></thead><tbody>'+cases.map(c=>{const open=state.expanded.has(c.id);const last=c.emails.map(e=>e.lastEmailAt).filter(Boolean).sort().reverse()[0];return '<tr><td><button class="action" data-action="toggle" data-id="'+esc(c.id)+'">'+(open?'▾':'▸')+'</button><span class="item">'+esc(c.name)+'</span></td><td>'+c.emails.length+'</td><td>'+pill(due(c.emails))+'</td><td class="wide">'+date(last)+'</td><td><button class="action" data-action="archive-case" data-id="'+esc(c.id)+'">Chiudi e archivia</button></td></tr>'+(open?'<tr><td colspan="5" class="details">'+(c.emails.length?c.emails.map(mailHtml).join(''):'<div class="muted">Nessuna email collegata</div>')+'</td></tr>':'')}).join('')+'</tbody></table>':'<div class="empty">Nessun caso corrispondente ai filtri.</div>';
}
async function load(){try{const data=await rpc('gspDashboardData');state.data=data;render()}catch(e){$('content').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('refresh').onclick=load;
$('search').oninput=e=>{state.query=e.target.value;render()};
$('filter').onchange=e=>{state.filter=e.target.value;render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
$('content').addEventListener('click',async evt=>{const b=evt.target.closest('button[data-action]');if(!b||state.busy)return;const action=b.dataset.action,id=b.dataset.id;
if(action==='toggle'){state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render();return}
if(action==='edit'){const emails=[...state.data.ungrouped,...state.data.cases.flatMap(c=>c.emails)];const email=emails.find(e=>e.key===id);if(!email)return;const status=prompt('Stato email:',email.status||'');if(status===null)return;const notes=prompt('Note:',email.notes||'');if(notes===null)return;const dueDate=prompt('Scadenza (AAAA-MM-GG, vuoto per rimuovere):',email.dueDate||'');if(dueDate===null)return;if(dueDate&&!/^\d{4}-\d{2}-\d{2}$/.test(dueDate)){toast('Data non valida');return}state.busy=true;try{await rpc('gspDashboardMutate',{action:'save-email',id,patch:{status,notes,dueDate}});await load();toast('Conversazione aggiornata')}catch(e){toast('Errore: '+e.message)}finally{state.busy=false}return}
if(!confirm(action==='restore'?'Ripristinare questo elemento?':action==='detach'?'Scollegare la conversazione dal caso?':'Chiudere e archiviare questo elemento?'))return;
state.busy=true;b.disabled=true;
try{await rpc('gspDashboardMutate',{action,id});await load();toast('Operazione completata')}catch(e){toast('Errore: '+e.message)}finally{state.busy=false;b.disabled=false}
});
load();
</script></body></html>
