name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - '*.gs'
      - 'appsscript.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmail-superpowers-apps-script
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy configuration
        id: config
        env:
          WEBAPP_URL: ${{ vars.APPS_SCRIPT_WEBAPP_URL }}
          DEPLOY_TOKEN: ${{ secrets.APPS_SCRIPT_DEPLOY_TOKEN }}
        run: |
          if [ -z "$WEBAPP_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo 'Apps Script deploy receiver is not configured yet.'
            echo 'Set repository variable APPS_SCRIPT_WEBAPP_URL and secret APPS_SCRIPT_DEPLOY_TOKEN.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Build deploy payload
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOY_TOKEN: ${{ secrets.APPS_SCRIPT_DEPLOY_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          files = []
          for path in sorted(Path('.').glob('*.gs')):
              files.append({
                  'name': path.stem,
                  'type': 'SERVER_JS',
                  'source': path.read_text(encoding='utf-8'),
              })

          manifest_path = Path('appsscript.json')
          manifest_source = manifest_path.read_text(encoding='utf-8')
          json.loads(manifest_source)
          files.append({
              'name': 'appsscript',
              'type': 'JSON',
              'source': manifest_source,
          })

          if len(files) < 2:
              raise SystemExit('No Apps Script source files found.')

          payload = {
              'action': 'deploy',
              'token': os.environ['DEPLOY_TOKEN'],
              'commit': os.environ.get('COMMIT_SHA', ''),
              'files': files,
          }
          Path('/tmp/gsp-deploy.json').write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding='utf-8',
          )
          print(f'Prepared {len(files)} Apps Script files.')
          PY

      - name: Deploy through Apps Script web app
        if: steps.config.outputs.configured == 'true'
        env:
          WEBAPP_URL: ${{ vars.APPS_SCRIPT_WEBAPP_URL }}
        run: |
          status="$(curl -sS -L \
            -o /tmp/gsp-deploy-response.json \
            -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/gsp-deploy.json \
            "$WEBAPP_URL")"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Deploy receiver returned HTTP $status" >&2
            head -c 2000 /tmp/gsp-deploy-response.json >&2 || true
            exit 1
          fi

          if ! jq -e '.ok == true' /tmp/gsp-deploy-response.json >/dev/null 2>&1; then
            echo 'Deploy receiver returned an error:' >&2
            cat /tmp/gsp-deploy-response.json >&2
            exit 1
          fi

          jq -r '"Apps Script HEAD updated: \(.files) files, commit \(.commit // "")"' /tmp/gsp-deploy-response.json
