name: Apply Gmail Superpowers case status patch

on:
  push:
    paths:
      - .github/workflows/gsp-case-status-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch userscript
        shell: python
        run: |
          from pathlib import Path

          path = Path("gmail-superpowers.user.js")
          text = path.read_text(encoding="utf-8")

          text = text.replace("// @version      0.7.0", "// @version      0.7.1", 1)
          text = text.replace("appVersion: '0.7.0'", "appVersion: '0.7.1'", 1)

          old = """      const due = findDeadlineForMember(member);\n      if (due?.dueDate) metaParts.push(`scade ${formatDate(due.dueDate)}`);\n      if (metaParts.length) {"""
          new = """      const due = findDeadlineForMember(member);\n      if (due?.dueDate) metaParts.push(`scade ${formatDate(due.dueDate)}`);\n      const note = findNoteForMember(member);\n      if (cleanText(note?.text)) metaParts.push(`stato: ${cleanText(note.text)}`);\n      if (metaParts.length) {"""

          if old not in text:
              raise SystemExit("Target case metadata block not found")

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/gsp-case-status-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmail-superpowers.user.js .github/workflows/gsp-case-status-patch.yml
          git commit -m "feat: show conversation status in Gmail case panel"
          git push
